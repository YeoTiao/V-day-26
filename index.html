<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentines?</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Arial', sans-serif; 
            background: linear-gradient(45deg, #ff6b6b, #feca57, #ff9ff3); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            color: white; 
            overflow-x: hidden; 
            position: relative; 
            transition: all 0.5s; 
        }
        .question {
            font-size: 4.5em; 
            text-shadow: 4px 4px 8px rgba(0,0,0,0.7); 
            animation: pulse 2s infinite; 
            margin-bottom: 40px;
            line-height: 1.1;
            text-align: center;
            font-weight: bold;
        }
        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.03); } 
            100% { transform: scale(1); } 
        }
        .countdown { 
            background: rgba(255,255,255,0.25); 
            padding: 25px; 
            border-radius: 20px; 
            font-size: 2.2em; 
            backdrop-filter: blur(12px); 
            margin: 30px 0; 
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .hearts { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 1; 
        }
        .heart { 
            position: absolute; 
            color: #ff69b4; 
            font-size: 26px; 
            animation: float 6s infinite linear; 
        }
        @keyframes float { 
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; } 
        }
        button { 
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e); 
            color: white; 
            border: none; 
            padding: 20px 40px; 
            font-size: 1.8em; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s; 
            margin: 15px; 
            z-index: 10;
            position: relative;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        button:hover { 
            transform: scale(1.1) translateY(-5px); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); 
        }
        .confetti { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            pointer-events: none; 
            z-index: 999; 
        }
        .confetti-piece { 
            position: absolute; 
            width: 14px; 
            height: 14px; 
            animation: confetti-fall 3s linear infinite; 
        }
        @keyframes confetti-fall { 
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; } 
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } 
        }
        .hidden { display: none !important; }
        .yes-celebrate { 
            font-size: 6em; 
            color: #ffd700; 
            animation: bounce 1s infinite; 
            text-align: center; 
            margin-bottom: 30px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.6);
            font-weight: bold;
        }
        @keyframes bounce { 
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 
            40% { transform: translateY(-50px); } 
            60% { transform: translateY(-25px); } 
        }
        .dog-container {
            font-size: 16em;
            margin: 30px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
        }
        .happy-dog {
            animation: dance 1.2s infinite ease-in-out;
        }
        @keyframes dance {
            0%, 100% { transform: rotate(0deg) scale(1) translateY(0); } 
            25% { transform: rotate(-20deg) scale(1.15) translateY(-20px); } 
            50% { transform: rotate(0deg) scale(1.25) translateY(-35px); } 
            75% { transform: rotate(20deg) scale(1.15) translateY(-20px); } 
        }
        .sad-dog {
            animation: shake 0.8s infinite ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-12px) rotate(-4deg); }
            75% { transform: translateX(12px) rotate(4deg); }
        }
        .bootyworld {
            font-size: 3.2em;
            color: #ffd700;
            text-align: center;
            margin-top: 40px;
            animation: pulse 2s infinite;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.7);
            font-weight: bold;
        }
        .content-container {
            z-index: 10;
            position: relative;
            text-align: center;
            max-width: 95%;
        }
        .no-prompt-text {
            font-size: 2.8em; 
            margin-bottom: 40px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.6);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Hearts Background -->
    <div class="hearts" id="hearts"></div>
    
    <!-- Confetti Layer -->
    <div class="confetti" id="confetti"></div>
    
    <!-- Main Content -->
    <div class="content-container">
        <!-- COUNTDOWN -->
        <div class="countdown" id="countdown">
            <strong id="days">Loading...</strong> days until Feb 14, 2026! 💖
        </div>
        
        <!-- INITIAL SCREEN: QUESTION + BUTTONS -->
        <div id="questionScreen">
            <h1 class="question">Will you be my Valentines?</h1>
            <div id="initialButtons">
                <button onclick="handleYes()">Yes 🥳</button>
                <button onclick="handleNo()">No 😢</button>
            </div>
        </div>
        
        <!-- YES CELEBRATION -->
        <div id="celebrate" class="hidden">
            <div class="dog-container">
                <span class="happy-dog">🥳🐶💃🎉</span>
            </div>
            <div class="yes-celebrate">YES!!!!!</div>
            <div class="bootyworld">See you at Bootyworld 2pm! 🎉</div>
        </div>
        
        <!-- NO PROMPT -->
        <div id="noPrompt" class="hidden">
            <p class="no-prompt-text">Yes or Yes? 💕</p>
            <button onclick="handleYes()">Yes! 🥰</button>
            <button onclick="handleYes()">Yes!! 🥳</button>
        </div>
    </div>

    <!-- Sad Dog Modal -->
    <div id="sadDogModal" class="dog-modal" onclick="closeDogModal()">
        <div class="dog-container">
            <span class="sad-dog">😢🥺🐶💔</span>
        </div>
    </div>

    <script>
        console.log('💖 Valentine page loaded!');
        
        // Countdown
        function updateCountdown() {
            const now = new Date();
            const target = new Date('2026-02-14T00:00:00+08:00');
            const diff = target - now;
            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById('days').textContent = days;
            } else {
                document.getElementById('days').textContent = 'Today!';
            }
        }
        updateCountdown();
        setInterval(updateCountdown, 60000);
        
        // Hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = ['💖', '💕', '💗', '❤️'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('hearts').appendChild(heart);
            setTimeout(() => {if (heart.parentNode) heart.remove();}, 8000);
        }
        setInterval(createHeart, 180);
        for(let i = 0; i < 10; i++) setTimeout(createHeart, i * 250);
        
        function closeDogModal() {
            document.getElementById('sadDogModal').style.display = 'none';
        }
        
        function createConfetti() {
            const confetti = document.getElementById('confetti');
            confetti.innerHTML = '';
            for (let i = 0; i < 250; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + '%';
                piece.style.background = ['#ff69b4', '#ffd700', '#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3'][Math.floor(Math.random() * 6)];
                piece.style.animationDelay = Math.random() * 2 + 's';
                piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.appendChild(piece);
                setTimeout(() => piece.remove(), 5000);
            }
        }
        
        function handleYes() {
            console.log('✅ YES!');
            document.getElementById('questionScreen').classList.add('hidden');
            document.getElementById('noPrompt').classList.add('hidden');
            document.getElementById('sadDogModal').style.display = 'none';
            document.getElementById('celebrate').classList.remove('hidden');
            createConfetti();
            for(let i = 0; i < 40; i++) setTimeout(createHeart, i * 60);
        }
        
        function handleNo() {
            console.log('❌ No clicked');
            const sadModal = document.getElementById('sadDogModal');
            sadModal.style.display = 'flex';
            setTimeout(() => {
                sadModal.style.display = 'none';
                document.getElementById('questionScreen').classList.add('hidden');
                document.getElementById('noPrompt').classList.remove('hidden');
            }, 3000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:D click me!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #ff9ff3);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            overflow-x: hidden;
            position: relative;
        }
        h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
            margin-bottom: 20px;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .countdown {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 15px;
            font-size: 2em;
            backdrop-filter: blur(10px);
            margin: 20px 0;
        }
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            animation: float 6s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            margin: 10px;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .photo-section {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            width: 100%;
        }
        .photo {
            max-width: 90%;
            max-height: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .photo-caption {
            margin-top: 10px;
            font-size: 1.1em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <h1>:D click me!</h1>
    <div class="countdown" id="countdown">
        <strong id="days">Loading...</strong> days until Feb 14, 2026!
    </div>
    <div style="margin-top: 30px;">
        <button onclick="yes()">Yes! 🥰</button>
        <button onclick="maybe()">Maybe 😊</button>
    </div>
    <div class="photo-section">
        <img src="IMG_2284.jpg" alt="Our Sunset Moment" class="photo">
        <p class="photo-caption">Our magical sunset 🌅🌊</p>
    </div>

    <script>
        // Live Countdown (15 days as of Jan 29, 2026)
        function updateCountdown() {
            const now = new Date();
            const target = new Date('2026-02-14T00:00:00+08:00');
            const diff = target - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('days').textContent = days;
        }
        updateCountdown();
        setInterval(updateCountdown, 24 * 60 * 60 * 1000);

        // Animated Hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('hearts').appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createHeart, 300);

        function yes() {
            alert('Yay! Let\'s make more memories! 🌅💕');
        }
        function maybe() {
            alert('Think about it over another sunset? 😘');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you be my Valentine?</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow-x: hidden; /* Prevent scrollbar during animation */
        }

        /* Container for the card look */
        .container {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
            z-index: 10; /* Keep above falling emojis */
            position: relative;
        }

        /* Banner Photo */
        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            object-fit: cover;
        }

        h1 {
            color: #ff4757;
            font-size: 1.8em;
            margin-bottom: 25px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .yes-btn { background: #2ed573; }
        .no-btn { background: #ff4757; }

        /* Success Message */
        .success-message {
            display: none;
            color: #ffa502;
            font-size: 1.5em;
            font-weight: bold;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Falling Elements (Confetti & Emojis) */
        .falling-element {
            position: fixed;
            top: -50px;
            z-index: 9999; /* On top of everything */
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .hidden { display: none; }

    </style>
</head>
<body>

    <div class="container">
        <img src="IMG_2281.jpg" alt="Us" class="banner-img">

        <h1 id="question">Will you be my Valentine? 💖</h1>

            </div>
